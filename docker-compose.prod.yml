services:
  marcatempo:
    image: zibola/marcatempo:latest
    container_name: marcatempo_app
    volumes:
      - ./attendance.db:/app/attendance.db
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
      - PORT=8080
    # network_mode: "host"

  nginx:
    image: nginx:alpine
    container_name: marcatempo_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - marcatempo
    restart: unless-stopped
